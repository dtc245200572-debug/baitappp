<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Tạo Form Đơn Giản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        .form-container {
            background-color: #ffffff;
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .inline-label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        .btn-group {
            margin-top: 20px;
        }
        button[type="submit"] {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #27ae60;
        }
        button[type="reset"] {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }
        button[type="reset"]:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM CƠ BẢN -->
    <div class="form-container">
        <h2>Phần 1: Form Thông Tin Sở Thích</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" required>
            </div>

            <div class="form-group">
                <label for="email_p1">Email:</label>
                <input type="email" id="email_p1" name="email" required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <input type="checkbox" id="thethao" name="hobby" value="thethao">
                <label for="thethao" class="inline-label">Thể thao</label>

                <input type="checkbox" id="amnhac" name="hobby" value="amnhac">
                <label for="amnhac" class="inline-label">Âm nhạc</label>

                <input type="checkbox" id="dolsach" name="hobby" value="dolsach">
                <label for="dolsach" class="inline-label">Đọc sách</label>

                <input type="checkbox" id="dulich" name="hobby" value="dulich">
                <label for="dulich" class="inline-label">Du lịch</label>
            </div>

            <div class="btn-group">
                <button type="submit">Gửi thông tin</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>

    <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container">
        <h2>Phần 2: Form Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email_p2">Email:</label>
                <input type="email" id="email_p2" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <input type="radio" id="male" name="gender" value="Nam">
                <label for="male" class="inline-label">Nam</label>

                <input type="radio" id="female" name="gender" value="Nữ">
                <label for="female" class="inline-label">Nữ</label>

                <input type="radio" id="other" name="gender" value="Khác">
                <label for="other" class="inline-label">Khác</label>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="HTML & CSS">HTML & CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hình thức học:</label>
